user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 1024;
}

http {
	# Public artist share links: per-IP rate limit (tokens are unguessable; this caps abuse/DoS)
	limit_req_zone $binary_remote_addr zone=share_api:10m rate=10r/m;

	server {
    	listen 80;
        server_name localhost 127.0.0.1;

        location / {
        	proxy_pass          http://frontend:80;
            proxy_set_header    X-Forwarded-For $remote_addr;
        }

        # Share-link URLs carry a bearer token: never write them to access logs.
        location /api/share/ {
            access_log          off;
            limit_req           zone=share_api burst=20 nodelay;
            limit_req_status    429;
            proxy_pass          http://backend:5001;
            proxy_set_header    X-Forwarded-For $remote_addr;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
        }

        location /share/ {
            access_log          off;
            add_header          Referrer-Policy "no-referrer" always;
            add_header          X-Robots-Tag "noindex, nofollow" always;
            add_header          Cache-Control "no-store" always;
            proxy_pass          http://frontend:80;
            proxy_set_header    X-Forwarded-For $remote_addr;
        }

        location /api {
            proxy_pass          http://backend:5001;
            proxy_set_header    X-Forwarded-For $remote_addr;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
        }
    }
}